name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar casca nativa do projeto
        run: |
          flutter create --org br.meuplayer --project-name meu_player --platforms android .
          cp extras/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r extras/icone_res/* android/app/src/main/res/
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true

      - name: Baixar dependências
        run: flutter pub get

      - name: Corrigir problemas de build em plugins antigos
        run: |
          python3 - <<'PYEOF'
          import glob, os, re

          pattern = os.path.expanduser("~/.pub-cache/hosted/pub.dev/on_audio_query_android-*")
          for plugin_dir in glob.glob(pattern):
              gradle_file = os.path.join(plugin_dir, "android", "build.gradle")
              manifest_file = os.path.join(plugin_dir, "android", "src", "main", "AndroidManifest.xml")
              if not os.path.isfile(gradle_file):
                  continue
              content = open(gradle_file).read()
              changed = False

              if "namespace" not in content:
                  manifest = open(manifest_file).read()
                  m = re.search(r'package="([^"]+)"', manifest)
                  if m:
                      pkg = m.group(1)
                      content = content.replace("android {", "android {\n    namespace '%s'" % pkg, 1)
                      changed = True
                      print("Namespace '%s' adicionado em %s" % (pkg, gradle_file))

              if "kotlinOptions" not in content:
                  block = "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }"
                  content = content.replace("android {", block, 1)
                  changed = True
                  print("JVM target corrigido em %s" % gradle_file)

              if changed:
                  open(gradle_file, "w").write(content)
          PYEOF

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
