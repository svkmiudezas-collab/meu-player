name: meu_player
description: Player de música offline que lê as músicas do aparelho e mantém biblioteca, favoritos e playlists salvos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  on_audio_query: ^2.9.0        # lê as músicas do aparelho (MediaStore / MPMediaLibrary)
  just_audio: ^0.9.40           # reprodução
  just_audio_background: ^0.0.1-beta.13  # controles na notificação / tela de bloqueio
  hive: ^2.2.3                  # banco local para biblioteca, favoritos, playlists e estado
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
